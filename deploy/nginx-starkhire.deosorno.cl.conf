# Repo-only example. Do not install until DNS for starkhire.deosorno.cl exists
# and the operator has approved changes on the server.
# Do not edit the Nginx site for agent.deosorno.cl or any other existing vhost.
#
# After copying this file into the host's Nginx layout, configure TLS with
# the server's established certificate process. Do not invent certificate
# paths here. Validate with `nginx -t` before reloading Nginx.
# The agent must listen on 127.0.0.1:8797 (or the free port chosen in INSTALL.md).

server {
    listen 80;
    listen [::]:80;
    server_name starkhire.deosorno.cl;

    location / {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
